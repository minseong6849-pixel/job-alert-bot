name: 채용공고 체크

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 기준 0시)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chrome 설치 (한국투자증권 크롤링용)
        uses: browser-actions/setup-chrome@v1

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 크롤링 및 알림 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_monitor.py

      - name: 변경된 seen_jobs.json 커밋
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "update seen jobs"
          git push
